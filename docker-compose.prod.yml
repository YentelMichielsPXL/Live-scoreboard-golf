services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ThisIsAnHardPassw0rd
      POSTGRES_DB: golfdb
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d golfdb"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:ThisIsAnHardPassw0rd@db:5432/golfdb
      - SECRET_USERNAME=${SECRET_USERNAME}
      - SECRET_PASSWORD=${SECRET_PASSWORD}
    
    depends_on:
      db:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "8080:80"
    restart: always

volumes:
  postgres_prod_data:
